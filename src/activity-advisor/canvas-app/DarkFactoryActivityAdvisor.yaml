# DarkFactory Activity Advisor — Human-Readable Screen Reference
#
# PURPOSE: Documentation reference only. Describes screen layout and PowerFx formulas
#          in a readable format. This file cannot be imported into Power Apps directly.
#
# TO BUILD A RUNNABLE .msapp:
#   The pac canvas pack source files live alongside this file:
#     src/App.fx.yaml          ← app-level properties
#     src/SubmitScreen.fx.yaml ← screen controls and PowerFx formulas
#     pkgs/DataSources/        ← data source stubs
#     CanvasManifest.json      ← app manifest
#
#   Run from this directory:
#     pwsh build.ps1
#
#   Prerequisites: pac CLI — winget install Microsoft.PowerPlatformCLI
#   After import:  reconnect SharePoint data source to your DarkFactory site.
#
# Data sources required:
#   - SharePoint connector → DarkFactory site → DarkFactory-ActivityRequests (read/write)

App:
  Name: DarkFactory Activity Advisor
  Description: Submit outdoor activity requests and view AI-powered weather suitability assessments.
  DataSources:
    - Type: SharePoint
      ConnectionName: DarkFactory SharePoint
      SiteUrl: "{DARKFACTORY_SP_SITE_URL}"
      Lists:
        - DarkFactory-ActivityRequests

Screens:
  - Name: SubmitScreen
    DisplayName: Submit Activity Request
    OnVisible: |
      ClearCollect(
        colMyRequests,
        Sort(
          Filter(
            'DarkFactory-ActivityRequests',
            RequestedBy.Email = User().Email
          ),
          Created,
          SortOrder.Descending
        )
      )

    Controls:
      - Name: lblTitle
        Type: Label
        Text: '"DarkFactory Activity Advisor"'
        FontSize: 20
        FontWeight: Bold

      - Name: ddActivity
        Type: Dropdown
        Items: '["Trail Run", "Cycling", "Swimming", "Hiking", "Other"]'
        Label: Activity

      - Name: txtLocation
        Type: TextInput
        Hint: '"Enter city name, e.g. Wellington"'
        Label: Location

      - Name: dtpRequestedDateTime
        Type: DateTimePicker
        DefaultDate: DateAdd(Now(), 1, Days)
        Label: Requested Date & Time

      - Name: btnSubmit
        Type: Button
        Text: '"Submit"'
        OnSelect: |
          If(
            IsBlank(ddActivity.Selected.Value) Or
            IsBlank(txtLocation.Text) Or
            IsBlank(dtpRequestedDateTime.SelectedDate),
            Notify("Please fill in all fields before submitting.", NotificationType.Error),
            Patch(
              'DarkFactory-ActivityRequests',
              Defaults('DarkFactory-ActivityRequests'),
              {
                Title: ddActivity.Selected.Value & " @ " & txtLocation.Text,
                Activity: ddActivity.Selected.Value,
                Location: txtLocation.Text,
                RequestedDateTime: dtpRequestedDateTime.SelectedDate,
                Status: { Value: "Pending" },
                RequestedBy: { Email: User().Email, DisplayName: User().FullName }
              }
            );
            Reset(ddActivity);
            Reset(txtLocation);
            Notify("Request submitted! Your assessment will appear below shortly.", NotificationType.Success);
            ClearCollect(
              colMyRequests,
              Sort(
                Filter('DarkFactory-ActivityRequests', RequestedBy.Email = User().Email),
                Created,
                SortOrder.Descending
              )
            )
          )

      - Name: lblValidationError
        Type: Label
        Text: '"All fields are required."'
        Visible: |
          IsBlank(ddActivity.Selected.Value) Or
          IsBlank(txtLocation.Text) Or
          IsBlank(dtpRequestedDateTime.SelectedDate)
        Color: Red

      - Name: lblResultsHeading
        Type: Label
        Text: '"My Recent Requests"'
        FontSize: 14
        FontWeight: Semibold

      - Name: galMyRequests
        Type: Gallery
        Items: colMyRequests
        TemplateSize: 80

        TemplateControls:
          - Name: lblGalActivity
            Type: Label
            Text: ThisItem.Activity & " @ " & ThisItem.Location
            FontWeight: Bold

          - Name: lblGalDateTime
            Type: Label
            Text: Text(ThisItem.RequestedDateTime, "[$-en-NZ]dd/MM/yyyy HH:mm")

          - Name: lblGalStatus
            Type: Label
            Text: |
              If(ThisItem.Status.Value = "Pending", "⏳ Pending",
                If(ThisItem.Status.Value = "Complete",
                  If(ThisItem.RiskLevel.Value = "Safe", "🟢 Safe",
                    If(ThisItem.RiskLevel.Value = "Caution", "🟡 Caution", "🔴 Unsafe")),
                  "❌ Error"))

          - Name: lblGalReason
            Type: Label
            Text: If(IsBlank(ThisItem.AssessmentReason), "", ThisItem.AssessmentReason)
            Overflow: TextOverflow.Scroll
            Visible: ThisItem.Status.Value = "Complete"
