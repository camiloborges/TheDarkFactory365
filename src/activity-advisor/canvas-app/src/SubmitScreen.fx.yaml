- SubmitScreen As screen:
    Fill: =RGBA(255, 255, 255, 1)
    OnVisible: |-
        =ClearCollect(
            colMyRequests,
            Sort(
                Filter(
                    'DarkFactory-ActivityRequests',
                    RequestedBy.Email = User().Email
                ),
                Created,
                SortOrder.Descending
            )
        )

    - lblTitle As label:
        Text: ="DarkFactory Activity Advisor"
        X: =16
        Y: =16
        Width: =800
        Height: =44
        Size: =20
        FontWeight: =FontWeight.Bold
        Color: =RGBA(0, 120, 212, 1)

    - lblActivityLabel As label:
        Text: ="Activity"
        X: =16
        Y: =72
        Width: =200
        Height: =24

    - ddActivity As dropdown:
        Items: =["Trail Run", "Cycling", "Swimming", "Hiking", "Other"]
        X: =16
        Y: =96
        Width: =400
        Height: =44

    - lblLocationLabel As label:
        Text: ="Location"
        X: =16
        Y: =152
        Width: =200
        Height: =24

    - txtLocation As text:
        HintText: ="Enter city name, e.g. Wellington"
        X: =16
        Y: =176
        Width: =400
        Height: =44

    - lblDateLabel As label:
        Text: ="Requested Date & Time"
        X: =16
        Y: =232
        Width: =300
        Height: =24

    - dtpRequestedDateTime As datePicker:
        DefaultDate: =DateAdd(Now(), 1, Days)
        X: =16
        Y: =256
        Width: =400
        Height: =44

    - btnSubmit As button:
        Text: ="Submit"
        X: =16
        Y: =316
        Width: =200
        Height: =44
        OnSelect: |-
            =If(
                IsBlank(ddActivity.Selected.Value) Or
                IsBlank(txtLocation.Text) Or
                IsBlank(dtpRequestedDateTime.SelectedDate),
                Notify("Please fill in all fields before submitting.", NotificationType.Error),
                Patch(
                    'DarkFactory-ActivityRequests',
                    Defaults('DarkFactory-ActivityRequests'),
                    {
                        Title: ddActivity.Selected.Value & " @ " & txtLocation.Text,
                        Activity: ddActivity.Selected.Value,
                        Location: txtLocation.Text,
                        RequestedDateTime: dtpRequestedDateTime.SelectedDate,
                        Status: { Value: "Pending" },
                        RequestedBy: {
                            Email: User().Email,
                            DisplayName: User().FullName
                        }
                    }
                );
                Reset(ddActivity);
                Reset(txtLocation);
                Notify(
                    "Request submitted! Your assessment will appear below shortly.",
                    NotificationType.Success
                );
                ClearCollect(
                    colMyRequests,
                    Sort(
                        Filter(
                            'DarkFactory-ActivityRequests',
                            RequestedBy.Email = User().Email
                        ),
                        Created,
                        SortOrder.Descending
                    )
                )
            )

    - lblValidationError As label:
        Text: ="All fields are required."
        Visible: |-
            =IsBlank(ddActivity.Selected.Value) Or
            IsBlank(txtLocation.Text) Or
            IsBlank(dtpRequestedDateTime.SelectedDate)
        X: =16
        Y: =368
        Width: =700
        Height: =28
        Color: =RGBA(220, 53, 69, 1)

    - lblResultsHeading As label:
        Text: ="My Recent Requests"
        X: =16
        Y: =420
        Width: =400
        Height: =32
        Size: =14
        FontWeight: =FontWeight.Semibold

    - galMyRequests As galleryFlexibleHeight:
        Items: =colMyRequests
        X: =16
        Y: =460
        Width: =1334
        Height: =300
        TemplateSize: =80

        - lblGalActivity As label:
            Text: =ThisItem.Activity & " @ " & ThisItem.Location
            X: =8
            Y: =4
            Width: =800
            Height: =28
            FontWeight: =FontWeight.Bold

        - lblGalDateTime As label:
            Text: =Text(ThisItem.RequestedDateTime, "[$-en-NZ]dd/MM/yyyy HH:mm")
            X: =8
            Y: =32
            Width: =400
            Height: =24

        - lblGalStatus As label:
            Text: |-
                =If(ThisItem.Status.Value = "Pending", "⏳ Pending",
                    If(ThisItem.Status.Value = "Complete",
                        If(ThisItem.RiskLevel.Value = "Safe", "🟢 Safe",
                            If(ThisItem.RiskLevel.Value = "Caution", "🟡 Caution", "🔴 Unsafe")),
                        "❌ Error"))
            X: =820
            Y: =4
            Width: =300
            Height: =28

        - lblGalReason As label:
            Text: =If(IsBlank(ThisItem.AssessmentReason), "", ThisItem.AssessmentReason)
            X: =8
            Y: =56
            Width: =1000
            Height: =20
            Visible: =ThisItem.Status.Value = "Complete"
