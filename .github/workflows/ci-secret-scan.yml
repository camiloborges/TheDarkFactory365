name: CI — Secret Scan

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  gitleaks:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required — gitleaks scans commit history, not just HEAD
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required for the action to post PR annotations on findings.
          # No GITLEAKS_LICENSE needed — this repository is public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
